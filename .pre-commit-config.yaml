# Hooks de pre-commit. Instalación:
#   pip install pre-commit && pre-commit install
# Verificar todo:
#   pre-commit run --all-files

repos:
  # BASE — obligatorio
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # GITLEAKS — escaneo de secretos, obligatorio
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # JS/TS — formato y lint con pnpm
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (formato)
        entry: pnpm exec prettier --write
        language: system
        files: \.(js|jsx|ts|tsx|css|json|md|ya?ml)$
        pass_filenames: true
      - id: eslint
        name: ESLint
        entry: pnpm lint
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: false
